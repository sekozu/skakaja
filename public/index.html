<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REST API BY SEKOZU</title>
</head>
<body>
<div id="app"></div>
<script>
const raw = `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>REST API BY SEKOZU</title><style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#f5f0e1;background-image:radial-gradient(#000 1.5px,transparent 1.5px);background-size:24px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;color:#000;padding:30px 20px;overflow-x:hidden;gap:40px}.card{position:relative;max-width:720px;width:100%;background:#ffde00;border:5px solid #000;box-shadow:14px 14px 0 #000;padding:60px 50px;text-align:center;transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translate(-4px,-4px);box-shadow:18px 18px 0 #000}.badge{position:absolute;top:-22px;left:30px;background:#ff2e88;color:#fff;border:4px solid #000;padding:6px 16px;font-weight:900;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;transform:rotate(-4deg);box-shadow:4px 4px 0 #000}.icon-wrapper{display:inline-flex;align-items:center;justify-content:center;width:90px;height:90px;margin-bottom:28px;background:#00e5ff;border:5px solid #000;box-shadow:6px 6px 0 #000;transform:rotate(-6deg);transition:transform .3s ease}.icon-wrapper:hover{transform:rotate(6deg) scale(1.1)}.icon-wrapper svg{width:48px;height:48px;stroke:#000;stroke-width:2.5}h1{font-size:clamp(1.8rem,6vw,3.4rem);font-weight:900;line-height:1;letter-spacing:-1px;text-transform:uppercase;color:#000;margin-bottom:8px;text-shadow:3px 3px 0 #ff2e88}h1 .highlight{background:#000;color:#ffde00;padding:0 10px;display:inline-block;transform:rotate(-2deg);margin-top:6px}.subtitle{margin-top:22px;display:inline-block;background:#fff;border:4px solid #000;padding:8px 18px;font-weight:700;font-size:.85rem;letter-spacing:3px;text-transform:uppercase;box-shadow:4px 4px 0 #000;transform:rotate(2deg)}.status{margin-top:30px;display:inline-flex;align-items:center;gap:10px;background:#00ff85;border:4px solid #000;padding:10px 22px;font-weight:900;font-size:.9rem;letter-spacing:2px;box-shadow:5px 5px 0 #000;text-transform:uppercase;animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.dot{width:12px;height:12px;background:#000;border-radius:50%;animation:blink 1s ease-in-out infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}.buttons{display:flex;gap:20px;margin-top:45px;justify-content:center;flex-wrap:wrap}.btn{padding:18px 38px;font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:.9rem;letter-spacing:2px;text-transform:uppercase;text-decoration:none;cursor:pointer;border:4px solid #000;box-shadow:6px 6px 0 #000;transition:all .15s ease;display:inline-block}.btn-primary{background:#ff2e88;color:#fff}.btn-outline{background:#fff;color:#000}.btn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 #000}.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}.footer{margin-top:50px;font-size:.8rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#000;padding-top:24px;border-top:4px dashed #000}.footer span{background:#000;color:#ffde00;padding:2px 8px;display:inline-block;margin:0 4px}.sticker{position:absolute;background:#00e5ff;border:4px solid #000;width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.7rem;text-align:center;box-shadow:4px 4px 0 #000;transform:rotate(15deg)}.sticker-top{top:30px;right:-20px}.sticker-bottom{bottom:30px;left:-20px;background:#b6ff00;transform:rotate(-12deg)}.endpoints{max-width:720px;width:100%}.endpoints h2{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;text-transform:uppercase;letter-spacing:-1px;margin-bottom:24px;text-align:center;text-shadow:2px 2px 0 #ff2e88}.endpoint-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.endpoint{background:#fff;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:20px 22px;transition:all .15s ease;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}.endpoint:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 #000}.endpoint.color-1{background:#ffde00}.endpoint.color-2{background:#00e5ff}.endpoint.color-3{background:#ff2e88;color:#fff}.endpoint.color-4{background:#b6ff00}.endpoint.color-5{background:#ffde00}.endpoint.color-3 .endpoint-desc{color:#ffe}.endpoint-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.method{background:#000;color:#00ff85;padding:4px 10px;font-weight:900;font-size:.75rem;letter-spacing:1.5px;border-radius:3px;flex-shrink:0}.path{font-family:'Courier New',monospace;font-weight:700;font-size:.95rem;word-break:break-all;color:#000}.path .default-id{background:#000;color:#ffde00;padding:0 4px;border-radius:2px}.endpoint.color-3 .path{color:#fff}.endpoint.color-3 .path .default-id{color:#fff;background:#000}.endpoint-desc{font-size:.85rem;font-weight:500;color:#444;line-height:1.4}.endpoint-action{margin-top:auto}.endpoint-action a,.endpoint-action button{display:inline-block;padding:8px 16px;background:#000;color:#fff;text-decoration:none;font-weight:900;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;border:3px solid #000;box-shadow:3px 3px 0 #ff2e88;transition:all .15s ease;cursor:pointer;font-family:'Space Grotesk',sans-serif}.endpoint-action a:hover,.endpoint-action button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #ff2e88}.endpoint.color-3 .endpoint-action a,.endpoint.color-3 .endpoint-action button{box-shadow:3px 3px 0 #000}@media(max-width:600px){.card{padding:45px 24px;box-shadow:10px 10px 0 #000}.buttons{flex-direction:column}.btn{width:100%}.sticker{width:55px;height:55px;font-size:.55rem}.sticker-top{right:-12px}.sticker-bottom{left:-12px}.endpoint-grid{grid-template-columns:1fr}}</style></head><body><div class="card"><div class="badge">API ANIME</div><div class="sticker sticker-top">NEW!</div><div class="sticker sticker-bottom">FAST</div><div class="icon-wrapper"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5"/></svg></div><h1>REST API <span class="highlight">BY SEKOZU</span></h1><div class="subtitle">Powerful &middot; Fast &middot; Reliable</div><div class="status"><span class="dot"></span>API ONLINE</div><div class="buttons"><a href="/api" class="btn btn-primary">GET STARTED</a><a href="https://github.com/sekozu" class="btn btn-outline">DOCS</a></div><div class="footer">&copy; 2026 <span>SEKOZU</span> All Rights Reserved</div></div><div class="endpoints"><h2>Available Endpoints</h2><div class="endpoint-grid"><div class="endpoint color-1"><div class="endpoint-top"><span class="method">GET</span><span class="path">/api</span></div><p class="endpoint-desc">Ambil daftar seluruh anime yang tersedia di database.</p><div class="endpoint-action"><a href="/api">Coba</a></div></div><div class="endpoint color-2"><div class="endpoint-top"><span class="method">GET</span><span class="path">/api/latest</span></div><p class="endpoint-desc">Daftar episode terbaru yang baru saja rilis, urut dari yang paling baru.</p><div class="endpoint-action"><a href="/api/latest">Coba</a></div></div><div class="endpoint color-3"><div class="endpoint-top"><span class="method">GET</span><span class="path">/api/popular</span></div><p class="endpoint-desc">Anime paling populer berdasarkan jumlah views dan rating.</p><div class="endpoint-action"><a href="/api/popular">Coba</a></div></div><div class="endpoint color-4"><div class="endpoint-top"><span class="method">GET</span><span class="path">/api/anime/:id</span></div><p class="endpoint-desc">Detail lengkap satu anime berdasarkan ID, termasuk sinopsis dan genre.</p><div class="endpoint-action"><button type="button" data-endpoint="/api/anime">Masukkan ID Anime</button></div></div><div class="endpoint color-5"><div class="endpoint-top"><span class="method">GET</span><span class="path">/api/watch/:id</span></div><p class="endpoint-desc">Link streaming video per episode, lengkap dengan kualitas 360p–1080p.</p><div class="endpoint-action"><button type="button" data-endpoint="/api/watch">Masukkan ID Anime</button></div></div></div></div></body></html>`;

const styleMatch = raw.match(/<style>[\s\S]*?<\/style>/i);
if (styleMatch) {
document.head.insertAdjacentHTML('beforeend', styleMatch[0]);
}

const content = raw.match(/<body[^>]*>([\s\S]*?)<\/body>/i)[1];

document.getElementById('app').innerHTML = content;

document.getElementById('app').addEventListener('click', function (e) {
const btn = e.target.closest('button[data-endpoint]');
if (!btn) return;

const base = btn.getAttribute('data-endpoint');
const id = prompt('Masukkan ID Anime:');

if (id && /^\d+$/.test(id.trim())) {
window.location.href = base + '/' + id.trim();
} else if (id !== null) {
alert('ID harus berupa angka');
}
});
</script>
</body>
</html>
