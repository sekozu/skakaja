<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REST API - BY SEKOZU</title>
</head>
<body>
<div id="app"></div>
<script>
const raw = `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>REST API BY SEKOZU</title><style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
html{scroll-behavior:smooth}
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0d0e;--panel:#111416;--line:#23282b;--text:#c5cbc6;--dim:#6b7570;--green:#8fd18f;--amber:#d9b45a;--blue:#7fb2d9;--white:#e8ece8}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;padding:28px 16px 48px;display:flex;flex-direction:column;align-items:center;gap:24px}
a{color:inherit}
.win{width:100%;max-width:880px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#161a1c;border-bottom:1px solid var(--line)}
.bar i{width:10px;height:10px;border-radius:50%;display:block}
.bar i:nth-child(1){background:#e0605a}
.bar i:nth-child(2){background:#e0b550}
.bar i:nth-child(3){background:#5fbf68}
.bar span{margin-left:10px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{padding:22px 24px 26px}
.ps{color:var(--green)}
.ps b{color:var(--blue);font-weight:500}
.cmd{color:var(--white)}
.line{margin-bottom:4px}
.out{padding-left:2px;margin:6px 0 20px}
.out .title{color:var(--white);font-weight:700;font-size:1.25rem;letter-spacing:.3px}
.out .title em{font-style:normal;color:var(--amber)}
.out .meta{color:var(--dim)}
.out .meta b{color:var(--text);font-weight:500}
.ok{color:var(--green)}
.ok::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:1px;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.links{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:4px;color:var(--text);text-decoration:none;font-family:inherit;font-size:13px;background:transparent;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:var(--green);color:var(--green);background:rgba(143,209,143,.06)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--text);vertical-align:-2px;animation:cur 1.1s steps(1) infinite}
@keyframes cur{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.endpoints{scroll-margin-top:20px}
.list{margin-top:8px;border-top:1px solid var(--line)}
.ep{display:grid;grid-template-columns:52px minmax(0,230px) 1fr auto;gap:14px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--line)}
.ep:hover{background:rgba(255,255,255,.02)}
.method{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.5px}
.path{color:var(--white);word-break:break-all}
.path u{text-decoration:none;color:var(--amber)}
.endpoint-desc{color:var(--dim);font-size:13px}
.endpoint-action a,.endpoint-action button{display:inline-block;padding:2px 10px;border:1px solid var(--line);border-radius:4px;color:var(--text);text-decoration:none;font-family:inherit;font-size:12px;background:transparent;cursor:pointer;white-space:nowrap;transition:border-color .12s,color .12s,background .12s}
.endpoint-action a:hover,.endpoint-action button:hover{border-color:var(--green);color:var(--green);background:rgba(143,209,143,.06)}
.footer{margin-top:22px;color:var(--dim);font-size:12px}
.footer span{color:var(--text)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--panel);border:1px solid #2f3639;border-radius:8px;max-width:420px;width:100%;position:relative;max-height:90vh;overflow-y:auto;padding:0 0 22px;animation:pop .15s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal::before{content:'';display:block;height:34px;background:#161a1c;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;background-image:radial-gradient(circle at 15px 17px,#e0605a 4.5px,transparent 5px),radial-gradient(circle at 32px 17px,#e0b550 4.5px,transparent 5px),radial-gradient(circle at 49px 17px,#5fbf68 4.5px,transparent 5px)}
.modal h3{font-size:.95rem;font-weight:700;color:var(--white);margin:18px 22px 16px}
.modal h3::before{content:'$ ';color:var(--green)}
#dynamicForm{padding:0 22px}
.modal label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.modal input,.modal select{width:100%;padding:9px 11px;background:#0b0d0e;color:var(--white);border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:14px;outline:none;margin-bottom:14px;transition:border-color .12s}
.modal input::placeholder{color:#434b47}
.modal input:focus,.modal select:focus{border-color:var(--green)}
.modal select option{background:#0b0d0e}
.modal-actions{display:flex;gap:10px;margin:6px 22px 0}
.modal-actions button{flex:1;padding:9px 14px;font-family:inherit;font-size:13px;border-radius:4px;cursor:pointer;border:1px solid var(--line);transition:all .12s}
.modal-cancel{background:transparent;color:var(--text)}
.modal-cancel:hover{border-color:#4a5350}
.modal-submit{background:var(--green);color:#0b0d0e;border-color:var(--green)!important;font-weight:700}
.modal-submit:hover{filter:brightness(1.08)}
.modal-close{position:absolute;top:0;right:0;width:34px;height:34px;background:transparent;border:0;color:var(--dim);cursor:pointer;font-size:1.2rem;font-family:inherit}
.modal-close:hover{color:var(--white)}
@media(max-width:640px){
body{padding:16px 10px 36px;font-size:13px}
.body{padding:18px 16px 22px}
.ep{grid-template-columns:44px 1fr;gap:4px 10px;padding:12px 2px}
.endpoint-desc{grid-column:1 / -1}
.endpoint-action{grid-column:1 / -1;margin-top:4px}
}
</style></head><body>
<div class="win">
<div class="bar"><i></i><i></i><i></i><span>sekozu@api: ~</span></div>
<div class="body">
<div class="line"><span class="ps">sekozu@api<b>:~</b>$</span> <span class="cmd">./about</span></div>
<div class="out">
<div class="title">REST API <em>by sekozu</em></div>
<div class="meta">anime data &middot; fast &middot; simple json</div>
<div class="meta">status&nbsp;&nbsp;<span class="ok">online</span></div>
<div class="links"><a href="#endpoints" class="btn">[ get started ]</a><a href="https://github.com/sekozu" class="btn">[ docs ]</a></div>
</div>
<div class="endpoints" id="endpoints">
<div class="line"><span class="ps">sekozu@api<b>:~</b>$</span> <span class="cmd">ls endpoints/</span></div>
<div class="list">
<div class="ep"><span class="method">GET</span><span class="path">/api</span><span class="endpoint-desc">Halaman dokumentasi ini.</span><div class="endpoint-action"><a href="/api">coba</a></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/home</span><span class="endpoint-desc">Data lengkap untuk halaman depan: latest, popular, dan jadwal.</span><div class="endpoint-action"><a href="/api/home">coba</a></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/latest</span><span class="endpoint-desc">Daftar episode terbaru yang baru saja rilis, urut dari yang paling baru.</span><div class="endpoint-action"><a href="/api/latest">coba</a></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/popular</span><span class="endpoint-desc">Anime paling populer berdasarkan jumlah views dan rating.</span><div class="endpoint-action"><a href="/api/popular">coba</a></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/jadwal</span><span class="endpoint-desc">Daftar jadwal rilis anime seminggu penuh (Senin - Minggu).</span><div class="endpoint-action"><a href="/api/jadwal">coba</a></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/anime/<u>:id</u></span><span class="endpoint-desc">Detail lengkap satu anime berdasarkan ID, termasuk sinopsis dan genre.</span><div class="endpoint-action"><button type="button" data-endpoint="/api/anime">masukkan id</button></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/watch/<u>:id</u><u>?ep=</u></span><span class="endpoint-desc">Link streaming video per episode (quality + url), default episode 1.</span><div class="endpoint-action"><button type="button" data-endpoint="/api/watch" data-episode="true">id &amp; episode</button></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/search</span><span class="endpoint-desc">Pencarian anime berdasarkan judul. Mendukung filter genre, status, tipe, dan halaman.</span><div class="endpoint-action"><button type="button" data-endpoint="/api/search" data-custom="search">buka form</button></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/kategori</span><span class="endpoint-desc">Filter anime berdasarkan genre, status, tipe, atau urutan. Bisa dikombinasikan.</span><div class="endpoint-action"><button type="button" data-endpoint="/api/kategori" data-custom="kategori">buka form</button></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/api/filter</span><span class="endpoint-desc">Daftar filter statis: type, genre, status, sort. Cocok buat isi dropdown.</span><div class="endpoint-action"><a href="/api/filter">coba</a></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/cache</span><span class="endpoint-desc">Lihat isi cache: key, size, age, hits.</span><div class="endpoint-action"><a href="/cache">coba</a></div></div>
<div class="ep"><span class="method">GET</span><span class="path">/cache/clear</span><span class="endpoint-desc">Hapus semua cache. Butuh key (locked page).</span><div class="endpoint-action"><a href="/cache/clear">coba</a></div></div>
</div>
</div>
<div class="footer">&copy; 2026 <span>SEKOZU</span> &middot; all rights reserved</div>
<div class="line" style="margin-top:14px"><span class="ps">sekozu@api<b>:~</b>$</span> <span class="cursor"></span></div>
</div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal"><button class="modal-close" id="modalClose">&times;</button><h3 id="modalTitle">Form</h3><div id="dynamicForm"></div><div class="modal-actions"><button class="modal-cancel" id="modalCancel">Batal</button><button class="modal-submit" id="modalSubmit">Cari</button></div></div></div>
</body></html>`;

const styleMatch = raw.match(/<style>[\s\S]*?<\/style>/i);
if (styleMatch) document.head.insertAdjacentHTML('beforeend', styleMatch[0]);

const content = raw.match(/<body[^>]*>([\s\S]*?)<\/body>/i)[1];
document.getElementById('app').innerHTML = content;

const overlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const dynamicForm = document.getElementById('dynamicForm');
const btnSubmit = document.getElementById('modalSubmit');
const btnCancel = document.getElementById('modalCancel');
const btnClose = document.getElementById('modalClose');

let currentBase = '';
let currentType = '';
let FILTER = { type: [], genre: [], status: [], sort: [] };

async function loadFilter() {
  try {
    const res = await fetch('/api/filter');
    const json = await res.json();
    if (json.status) FILTER = json.data;
  } catch {}
}

loadFilter();

const selectHtml = (id, label, options) => `
  <label for="${id}">${label}</label>
  <select id="${id}">
    <option value="">-- Semua --</option>
    ${options.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}
  </select>
`;

function openModal(base, type) {
  currentBase = base;
  currentType = type;
  dynamicForm.innerHTML = '';

  if (type === 'detail') {
    modalTitle.textContent = 'Masukkan ID Anime';
    dynamicForm.innerHTML = `<label for="inputId">ID Anime</label><input type="text" id="inputId" placeholder="contoh: 4564" inputmode="numeric">`;
    setTimeout(() => document.getElementById('inputId').focus(), 0);
  } else if (type === 'watch') {
    modalTitle.textContent = 'Masukkan ID & Episode';
    dynamicForm.innerHTML = `<label for="inputId">ID Anime</label><input type="text" id="inputId" placeholder="contoh: 4564" inputmode="numeric"><label for="inputEp">Episode</label><input type="text" id="inputEp" placeholder="kosongkan untuk episode 1" inputmode="numeric">`;
    setTimeout(() => document.getElementById('inputId').focus(), 0);
  } else if (type === 'search') {
    modalTitle.textContent = 'Pencarian Anime';
    dynamicForm.innerHTML = `
      <label for="q">Kata Kunci (q) *</label>
      <input type="text" id="q" placeholder="contoh: naruto">
      ${selectHtml('genre', 'Genre', FILTER.genre)}
      ${selectHtml('status', 'Status', FILTER.status)}
      ${selectHtml('type', 'Tipe', FILTER.type)}
      ${selectHtml('sort', 'Urutkan', FILTER.sort)}
      <label for="page">Halaman</label>
      <input type="text" id="page" placeholder="contoh: 1" inputmode="numeric">
    `;
    setTimeout(() => document.getElementById('q').focus(), 0);
  } else if (type === 'kategori') {
    modalTitle.textContent = 'Filter Kategori';
    dynamicForm.innerHTML = `
      ${selectHtml('genre', 'Genre', FILTER.genre)}
      ${selectHtml('status', 'Status', FILTER.status)}
      ${selectHtml('type', 'Tipe', FILTER.type)}
      ${selectHtml('sort', 'Urutkan', FILTER.sort)}
      <label for="page">Halaman</label>
      <input type="text" id="page" placeholder="contoh: 1" inputmode="numeric">
    `;
  }

  overlay.classList.add('active');
}

function closeModal() {
  overlay.classList.remove('active');
}

function submitModal() {
  let url = currentBase;
  const params = new URLSearchParams();

  if (currentType === 'detail') {
    const id = document.getElementById('inputId').value.trim();
    if (!/^\d+$/.test(id)) return alert('ID harus berupa angka');
    url += '/' + id;
  } else if (currentType === 'watch') {
    const id = document.getElementById('inputId').value.trim();
    if (!/^\d+$/.test(id)) return alert('ID harus berupa angka');
    const ep = document.getElementById('inputEp').value.trim();
    url += '/' + id;
    if (ep !== '') {
      if (!/^\d+$/.test(ep)) return alert('Episode harus berupa angka');
      params.append('ep', ep);
    }
  } else if (currentType === 'search') {
    const q = document.getElementById('q').value.trim();
    if (!q) return alert('Kata kunci (q) wajib diisi!');
    params.append('q', q);
    ['genre', 'status', 'type', 'sort', 'page'].forEach(id => {
      const v = document.getElementById(id).value;
      if (v) params.append(id, v);
    });
  } else if (currentType === 'kategori') {
    ['genre', 'status', 'type', 'sort', 'page'].forEach(id => {
      const v = document.getElementById(id).value;
      if (v) params.append(id, v);
    });
  }

  const qs = params.toString();
  if (qs) url += '?' + qs;
  window.location.href = url;
}

document.getElementById('app').addEventListener('click', function (e) {
  const btn = e.target.closest('button[data-endpoint]');
  if (!btn) return;
  const base = btn.getAttribute('data-endpoint');
  let type = 'detail';
  if (btn.getAttribute('data-episode') === 'true') type = 'watch';
  if (btn.getAttribute('data-custom')) type = btn.getAttribute('data-custom');
  openModal(base, type);
});

btnSubmit.addEventListener('click', submitModal);
btnCancel.addEventListener('click', closeModal);
btnClose.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (!overlay.classList.contains('active')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter') submitModal();
});
</script>
</body>
</html>
