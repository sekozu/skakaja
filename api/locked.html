<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locked</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#f5f0e1;background-image:radial-gradient(#000 1.5px,transparent 1.5px);background-size:24px 24px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;padding:20px}
.card{background:#ffde00;border:5px solid #000;box-shadow:14px 14px 0 #000;padding:50px 40px;max-width:420px;width:100%;text-align:center;position:relative}
.card::before{content:'LOCKED';position:absolute;top:-18px;left:24px;background:#ff2e88;color:#fff;border:4px solid #000;padding:4px 14px;font-weight:900;font-size:.75rem;letter-spacing:2px;transform:rotate(-4deg);box-shadow:3px 3px 0 #000}
h1{font-size:1.8rem;font-weight:900;text-transform:uppercase;margin-bottom:8px;text-shadow:2px 2px 0 #ff2e88}
p{font-size:.85rem;font-weight:700;margin-bottom:24px;color:#333}
input{width:100%;padding:14px 16px;border:4px solid #000;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;box-shadow:4px 4px 0 #000;outline:none;margin-bottom:18px}
input:focus{box-shadow:6px 6px 0 #ff2e88;transform:translate(-2px,-2px)}
button{width:100%;padding:16px;background:#00ff85;border:4px solid #000;box-shadow:5px 5px 0 #000;font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:.9rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .15s ease}
button:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
button:disabled{opacity:.6;cursor:not-allowed}
.err{color:#ff2e88;font-weight:900;font-size:.8rem;margin-top:12px;min-height:1em}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.popup.active{display:flex}
.popup-card{background:#fff;border:5px solid #000;box-shadow:14px 14px 0 #000;padding:40px 32px;max-width:380px;width:100%;text-align:center;position:relative}
.popup-card::before{content:'INFO';position:absolute;top:-16px;left:24px;background:#00e5ff;border:4px solid #000;padding:4px 14px;font-weight:900;font-size:.75rem;letter-spacing:2px;transform:rotate(-4deg);box-shadow:3px 3px 0 #000}
.popup-card.success::before{background:#00ff85;content:'SUKSES'}
.popup-card.error::before{background:#ff2e88;color:#fff;content:'GAGAL'}
.popup-card h2{font-size:1.4rem;font-weight:900;text-transform:uppercase;margin-bottom:12px;text-shadow:2px 2px 0 #ff2e88}
.popup-card p{font-size:.9rem;font-weight:700;color:#333;margin-bottom:24px;line-height:1.4}
.popup-btn{padding:12px 24px;background:#000;color:#fff;border:4px solid #000;box-shadow:4px 4px 0 #ff2e88;font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .15s ease}
.popup-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #ff2e88}
</style>
</head>
<body>
<div class="card">
  <h1>Hapus Cache</h1>
  <p>Masukkan key untuk menghapus semua cache.</p>
  <input type="password" id="key" placeholder="Masukkan key..." autofocus>
  <button id="btn">Hapus Cache</button>
  <div class="err" id="err"></div>
</div>
<div class="popup" id="popup">
  <div class="popup-card" id="popupCard">
    <h2 id="popupTitle"></h2>
    <p id="popupMsg"></p>
    <button class="popup-btn" id="popupClose">Tutup</button>
  </div>
</div>
<script>
document.getElementById('err').textContent = /[?&]error=1/.test(location.search) ? 'Key salah, coba lagi.' : '';

const submit = async () => {
  const input = document.getElementById('key');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const key = input.value.trim();
  if (!key) { err.textContent = 'Key wajib diisi'; return; }
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Menghapus...';
  try {
    const res = await fetch('/cache/clear?key=' + encodeURIComponent(key));
    if (res.ok) {
      const json = await res.json();
      showPopup('success', 'Berhasil', json.message || 'Cache berhasil dihapus.');
      input.value = '';
    } else if (res.status === 401) {
      showPopup('error', 'Gagal', 'Key salah. Coba lagi.');
    } else {
      showPopup('error', 'Gagal', 'Terjadi kesalahan.');
    }
  } catch (e) {
    showPopup('error', 'Gagal', 'Network error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Hapus Cache';
  }
};

const showPopup = (type, title, msg) => {
  const card = document.getElementById('popupCard');
  card.className = 'popup-card ' + type;
  document.getElementById('popupTitle').textContent = title;
  document.getElementById('popupMsg').textContent = msg;
  document.getElementById('popup').classList.add('active');
};

document.getElementById('btn').onclick = submit;
document.getElementById('key').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
document.getElementById('popupClose').onclick = () => document.getElementById('popup').classList.remove('active');
document.getElementById('popup').onclick = (e) => { if (e.target.id === 'popup') document.getElementById('popup').classList.remove('active'); };
</script>
</body>
</html>
